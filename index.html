<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE ARENA | AG EDITION</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="overlay">
        <div class="loader-content">
            <h1 class="neon-text">SNAKE ARENA</h1>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <p>CORE BY AG</p>
        </div>
    </div>

    <!-- Intro Screen -->
    <div id="intro" class="overlay hidden">
        <div class="intro-content">
            <h2 class="typing">NEON_EVOLUTION_v2.0</h2>
            <p class="credits-tag">DEVELOPED BY AG</p>
            <button id="start-btn" class="glow-button">INITIALIZE SYSTEM</button>
            <p class="hint">PC: WASD / MOBILE: SWIPE TO STEER</p>
        </div>
    </div>

    <!-- Gameplay -->
    <main id="game-container" class="hidden">
        <header class="game-header">
            <div class="stat-box">SCORE: <span id="current-score">000</span></div>
            <div class="stat-box">AG_OS v2</div>
        </header>
        <canvas id="gameCanvas"></canvas>
    </main>

    <!-- Game Over -->
    <div id="game-over" class="overlay hidden">
        <div class="over-content">
            <h1 class="glitch" data-text="TERMINATED">TERMINATED</h1>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn" class="glow-button">REBOOT</button>
            <p class="footer-credits">Special thanks to AG</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
