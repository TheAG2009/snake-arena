<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE ARENA | AG EDITION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader" class="overlay">
        <h1 class="neon-text">SNAKE ARENA</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <p class="ag-tag">ENGINE BY AG</p>
    </div>

    <div id="intro" class="overlay hidden">
        <h2 class="neon-text">SYSTEM READY</h2>
        <button id="start-btn" class="glow-button">START MISSION</button>
        <p class="credits-tag">360° TOUCH | WASD PC</p>
    </div>

    <main id="game-container" class="hidden">
        <header class="game-header">
            <div>SCORE: <span id="current-score">000</span></div>
            <div>AG_OS v2.5</div>
        </header>
        <canvas id="gameCanvas"></canvas>
    </main>

    <div id="game-over" class="overlay hidden">
        <h1 class="neon-text">TERMINATED</h1>
        <p>FINAL SCORE: <span id="final-score">0</span></p>
        <button id="restart-btn" class="glow-button">REBOOT</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
